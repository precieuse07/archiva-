<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiva - Inscription</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-form">
                <h1>Créer un compte</h1>

                <label for="fullname">Nom complet</label>
                <input type="text" id="fullname" placeholder="Nom complet">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Entrer votre email">

                <label for="niveau">Niveaux</label>
                <select id="niveau">
                    <option value="x1">X1</option>
                    <option value="x2">X2</option>
                    <option value="x3">X3</option>
                </select>

                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="Entrer votre mot de passe">

                <button class="btn-primary">Créer un compte</button>

                <p>Vous avez déjà un compte ? <a href="connexion.html">Connectez vous</a></p>
            </div>

            <div class="auth-illustration">
                <img src="assets/images/signup-illustration.png" alt="Illustration inscription">
            </div>
        </div>
    </div>

</body>
</html>
