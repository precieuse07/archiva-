<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiva - Connexion</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
    <div class="auth-form">
        <h1>Se connecter</h1>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Entrer votre email">

        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Entrer votre mot de passe">

        <a href="#" class="forgot">Mot de passe oublié ?</a>

        <button class="btn-primary">Se connecter</button>

        <p>Vous n'avez pas de compte ? <a href="#">Créez un nouveau compte</a></p>
    </div>

    <div class="auth-illustration">
        <img src="assets/images/login-illustration.png" alt="Illustration connexion">
    </div>
</div>

</body>
</html>
